server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: serve index.html for client-side routes
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API calls to the Spring Boot backend (same-origin, no CORS issues)
  # NOTE: $backend_upstream + resolver defers DNS lookup to request time so
  # nginx starts even if the backend host isn't resolvable yet (e.g. start order).
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8080;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Cache static assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
